name: Daily CFP Scraper

on:
  schedule:
    # Daily at 21:00 UTC (05:00 Beijing time the next day).
    - cron: '0 21 * * *'
  workflow_dispatch: # 允许手动点按钮触发

permissions:
  contents: write

concurrency:
  group: daily-cfp
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests curl-cffi DrissionPage beautifulsoup4 pyyaml lxml

      - name: Run CFP parser tests
        run: python -m unittest tests/test_cfp_scraper.py tests/test_data_integrity.py

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "⏳ 等待 FlareSolverr 启动..."
          ready=false
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q "ok"; then
              echo "✅ FlareSolverr 已就绪"
              ready=true
              break
            fi
            echo "   等待中... ($i/30)"
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "FlareSolverr did not become healthy" >&2
            exit 1
          fi

      - name: Run Scraper
        run: python bin/scrape_cfps.py
        env:
          PYTHONUNBUFFERED: 1
          FLARESOLVERR_URL: http://localhost:8191
          NATURE_MAX_PAGES: 120
          NATURE_DETAIL_WORKERS: 4

      - name: Check for changes
        id: git-check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/cfps.yml
          # 检查是否有变动，有变动才提交
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "🤖 Auto-update CFP list [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
