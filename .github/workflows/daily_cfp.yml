name: Daily CFP Scraper

on:
  schedule:
    # 每天 UTC 时间 00:00 运行 (北京时间早上 8:00)
    - cron: '0 21 */2 * *'
  workflow_dispatch: # 允许手动点按钮触发

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGE }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install curl-cffi DrissionPage beautifulsoup4 pyyaml lxml

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "⏳ 等待 FlareSolverr 启动..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q "ok"; then
              echo "✅ FlareSolverr 已就绪"
              break
            fi
            echo "   等待中... ($i/30)"
            sleep 2
          done

      - name: Run Scraper
        run: |
          # 确保脚本有执行权限（可选）
          # 假设你的脚本在根目录，且输出到 _data/cfps.yml
          # 你需要根据实际路径修改下面的路径
          python bin/scrape_cfps.py 
        env:
          # 如果你的脚本里写死了路径，这里不需要改；
          # 建议在脚本里把 OUTPUT_YML_PATH 改为 relative path 如 '_data/cfps.yml'
          PYTHONUNBUFFERED: 1

      - name: Check for changes
        id: git-check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/cfps.yml
          # 检查是否有变动，有变动才提交
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "🤖 Auto-update CFP list [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
