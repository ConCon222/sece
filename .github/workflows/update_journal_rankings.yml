name: Update Journal Rankings

on:
  schedule:
    # Eight 50-journal windows refresh the ~390-journal list about once a month.
    - cron: '0 2 1,5,9,13,17,21,25,29 * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      full_refresh:
        description: 'Re-scrape ALL journals (slow, may time out). Leave off for the normal rotating 50-journal window.'
        type: boolean
        default: false

concurrency:
  group: journal-ranking-rotation
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    services:
      # FlareSolverr container for bypassing anti-bot protection
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.JOU }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Chrome for DrissionPage
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml DrissionPage python-dotenv beautifulsoup4 lxml

    - name: Run journal pipeline unit tests
      run: python -m unittest tests/test_journal_pipeline.py tests/test_data_integrity.py

    - name: Update journal rankings
      id: ranking-update
      continue-on-error: true
      timeout-minutes: 300
      env:
        EASYSCHOLAR_KEY: ${{ secrets.EASYSCHOLAR_KEY }}
        FLARESOLVERR_URL: http://localhost:8191
        FLARESOLVERR_MAX_TIMEOUT_MS: '60000'
        FLARESOLVERR_REQUEST_TIMEOUT_SECONDS: '75'
      run: |
        # Default = a rotating window of 50 journals. Incremental atomic saves
        # preserve completed journals if this step reaches its timeout. The
        # cursor advances only when both child updaters complete successfully.
        # full_refresh=true forces the old all-at-once behavior on demand.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_refresh }}" = "true" ]; then
          echo "🐢 FULL refresh: re-scraping every journal (may take hours)"
          python bin/journal_data_manager.py --no-diff
        else
          echo "🔄 Rotating window: 50 journals from the saved cursor"
          python bin/journal_data_manager.py --no-diff --batch-size 50
        fi

    - name: Update journal aims & scope (feeds the venue recommender)
      if: steps.ranking-update.outcome == 'success'
      env:
        FLARESOLVERR_URL: http://localhost:8191
      run: |
        # Incremental: journals with stored aims are skipped, so after the
        # first full pass this step only fetches new/missing journals.
        python bin/scrape_aims.py || echo "aims scrape failed — keeping existing jaims.yml"

    - name: Check for changes
      id: verify-changed-files
      if: always()
      run: |
        if [ -n "$(git status --porcelain -- _data/jrank.yml _data/jaims.yml _data/.rank_cursor _data/jrank_meta.yml)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: always() && steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add _data/jrank.yml _data/jaims.yml _data/.rank_cursor _data/jrank_meta.yml
        git commit -m "🤖 Auto-update journal rankings - $(date +'%Y-%m-%d')"
        git pull --rebase origin main
        git push
        
    - name: Create summary
      if: always() && steps.verify-changed-files.outputs.changed == 'true'
      run: |
        echo "## 📊 Journal Rankings Updated" >> $GITHUB_STEP_SUMMARY
        echo "Completed ranking data was committed, including partial progress if the crawler timed out." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Data Sources:" >> $GITHUB_STEP_SUMMARY
        echo "- 🟠 Orange metrics (Scopus: CiteScore, Percentile)" >> $GITHUB_STEP_SUMMARY
        echo "- � Purple metrics (EasyScholar: JCR Quartile, IF)" >> $GITHUB_STEP_SUMMARY
        echo "- � Red metrics (CAS Division)" >> $GITHUB_STEP_SUMMARY
        echo "- 📝 Publisher websites (Acceptance rates, Review times)" >> $GITHUB_STEP_SUMMARY
        
    - name: No changes summary
      if: always() && steps.ranking-update.outcome == 'success' && steps.verify-changed-files.outputs.changed == 'false'
      run: |
        echo "## ✅ Journal Rankings Check Complete" >> $GITHUB_STEP_SUMMARY
        echo "No updates were needed - all journal ranking data is current." >> $GITHUB_STEP_SUMMARY

    - name: Incomplete update summary
      if: always() && steps.ranking-update.outcome != 'success'
      run: |
        echo "## ⚠️ Journal Rankings Update Incomplete" >> $GITHUB_STEP_SUMMARY
        echo "The crawler failed or timed out. Any atomically saved partial progress was committed, but the cursor was not advanced." >> $GITHUB_STEP_SUMMARY

    - name: Fail workflow when ranking update was incomplete
      if: always() && steps.ranking-update.outcome != 'success'
      run: |
        echo "Journal ranking update did not complete; the cursor was not advanced." >&2
        exit 1
