Asia Pacific Education Review:
  aims: 'The Asia Pacific Education Review (APER) seeks rigorous, high-quality educational research in all education-related
    fields. The journal aims to stimulate research, encourage academic exchange, and enhance the professional development
    of scholars and other researchers who are interested in educational issues within and beyond the Asia-Pacific region.
    All manuscripts should explicitly address educational topics using rigorous theoretical and empirical analysis. Papers
    from diverse disciplinary lenses (e.g., history, philosophy, political economy, psychology, sociology, etc.) are welcome.
    Importantly, the journal is not an area studies periodical but an educational research journal with expertise in and beyond
    the Asia-Pacific. The journal invites outstanding manuscripts using quantitative, qualitative, mixed methods, and philosophical/conceptual
    approaches in the following areas: - Adult education and lifelong learning - Comparative and international education -
    Education, culture and society - Educational policy and social change - Educational and school psychology - Educational
    technology - Gifted education - Globalization, internationalization and education - Higher education - Innovative educational
    research methods - Teacher education - Educational counselling The journal does not accept manuscripts for TESOL/English
    Teaching, Subject Education (e.g., Math, Science, Biology, Physics, Engineering), and Early Childhood Education.'
  source: https://link.springer.com/journal/12564/aims-and-scope
Asia Pacific Journal of Education:
  aims: 'Aims and scope Journal metrics Editorial board Asia Pacific Journal of Education focuses on education policy and
    governance, curriculum and pedagogy, and the everyday lives and practices of school leaders/management, educators and
    students with relevance to Asia and the Pacific region. We feature new empirical and theoretical work, as well as critical
    and exploratory essays that focus on key 21st century issues, such as those pertaining but not limited to globalization
    and geopolitics, postmodernity, information technology, and education for sustainability, with the aim of advancing the
    field of study. We welcome manuscripts in the following areas: Cultural and linguistic continuity and change; Ethnicity,
    class, gender and diversity in education; Systems and infrastructure development; Cultures and discourses of educational
    organizations/systems; Education policy/curriculum responses and enactment; Multicultural education; Rigorous philosophical/conceptual
    discussion of educational issues; Historical and contemporary relationships of educational ideas and systems; and Impact
    of new communication media and technologies, new and hybrid cultural forms and practices, and globalized economies on
    education. We seek papers: that focus on conceptual frameworks/framings; with potential to advance the field of study;
    that include policy implications; and that generate insights, concepts, and frameworks with implications beyond their
    immediate context/s. Peer Review Policy All submitted'
  source: https://www.tandfonline.com/journals/cape20
