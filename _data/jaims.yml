Cognition and Instruction:
  aims: 'Aims and scope Journal metrics Editorial board Among education journals, Cognition and Instruction ’s distinctive
    niche is rigorous study of foundational issues concerning the cognitive, socio-cultural, historical, political, ethical,
    and mediational processes and conditions of learning and development in and across a wide range of environments (e.g.,
    families, neighborhoods, schools, community-based settings, outdoor spaces, workplaces, friendships, social movements,
    etc.). For these purposes, both “cognition” and “instruction” must be interpreted broadly. The journal remains true to
    its roots in investigating cognition and instruction expansively, and we encourage submissions that attend to the “how”
    of learning and knowing as tied to the “why,” “for whom,” “where,” and “towards what ends?” A balance of data that illuminates
    processes of learning for individuals and groups in addition to expansive ways of understanding the outcomes of learning
    across time and place is therefore typical. Additionally, a balance of well-reasoned theoretical contributions and careful
    and reflective empirical findings and techniques is expected. The study of learning in design-based and naturally occurring
    circumstances is highly valued, but so is laboratory study in which context plays a consequential role in analysis. Representative
    but not exclusive topics for articles include: The conditions that support interest, affect, identity, ethical reasoning,
    collaboration, embodiment, movement and '
