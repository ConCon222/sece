    collaboration and intelligence theory; (5) Brain-like computing and its applications Cognitive Neurodynamics mainly publishes
    the following five types of articles: 1. Commentary (Renowned experts will be invited by the editorial office to make
    a special introduction and comment on the original innovation and the content of articles with significant innovation)
