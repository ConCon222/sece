Computers in Human Behavior:
  aims: 'Computers in Human Behavior is a scholarly journal dedicated to examining the use of computers from a psychological
    perspective. Original theoretical works, research reports, literature reviews, software reviews, book reviews and announcements
    are published. The journal addresses both the use of computers in psychology , psychiatry and related disciplines as well
    as the psychological impact of computer use on individuals, groups and society. The former category includes articles
    exploring the use of computers for professional practice, training, research and theory development. The latter category
    includes articles dealing with the psychological effects of computers on phenomena such as human development, learning,
    cognition, personality, and social interactions. The journal addresses human interactions with computers , not computers
    per se . The computer is discussed only as a medium through which human behaviors are shaped and expressed. The primary
    message of most articles involves information about human behavior. Therefore, professionals with an interest in the psychological
    aspects of computer use, but with limited knowledge of computers, will find this journal of interest. About ScienceDirect
    Remote access Contact and support Terms and conditions Privacy policy Cookie settings All content on this site: Copyright
    © 2026 Elsevier B.V., its licensors, and contributors. All rights are reserved, including those for text and data mining,
    AI training, and similar technologies'
  source: https://www.sciencedirect.com/journal/computers-in-human-behavior/about/aims-and-scope
Contemporary Educational Psychology:
  aims: 'Contemporary Educational Psychology publishes empirical research from around the globe that substantively advances,
    extends, or re-envisions the ongoing discourse in educational psychology research and practice. Publishable manuscripts
    must be grounded in a rich, inclusive theoretical and empirical framework that gives way to critical and timely questions
    facing educational psychology. Further, general and specific questions should be closely linked to the selected methodological
    approach and authors should include actionable implications for education research and practice. In all cases, accepted
    manuscripts will advance cutting edge theoretical and methodological perspectives that address critical and timely education
    questions. The journal welcomes rigorously conducted qualitative, quantitative, and mixed-methods contemporary empirical
    research within educational psychology. The journal also aims to publish research that employs participant samples representative
    of the intended population and engaged in authentic teaching or learning contexts, through either formal or informal settings.
    The journal highly encourages empirical research that exemplifies values of inclusion within education. In addition to
    novel, empirical studies rooted in primary data or data sources, submissions may include: Purposeful replication studies
    designed to extend our understanding of fundamental relationships or processes, Measurement or validation studies that
    include a second, related empiric'
  source: https://www.sciencedirect.com/journal/contemporary-educational-psychology/about/aims-and-scope
Critical Studies in Education:
  aims: Critical Studies in Education is a leading international journal devoted to publishing critical theoretical, methodological
    and empirical contributions to education research. The journal is anchored in the critical sociology of education, yet
    we welcome contributions from other disciplines that seek to critically examine the social relations of education (e.g.,
    history, philosophy, critical geography, politics and public policy studies). Critical Studies in Education is a key global
    forum for advancing original research that addresses the implications of intensifying social, political and economic challenges
    and how these shape education. It has a central concern with examining and disrupting unequal power relations, including
    but not limited to class, gender, race, sexuality, disability and coloniality. The journal adopts a broad definition of
    education, meaning submissions may focus on diverse education systems, policies, practices, knowledge and evidence. These
    may be related to a variety of settings, from schools, vocational and higher education to more informal forms of education,
    including the educational dynamics of popular and digital culture. Through publishing diverse forms of critical research
    in education, the journal does not assume that ‘critical research’ has a fixed meaning. It aims instead to generate conversations
    and debates about what it means to be critical in shifting theoretical, empirical and methodological contexts of education.
    What is constant is ou
  source: https://www.tandfonline.com/journals/rcse20/about-this-journal
Cultural Studies of Science Education:
  aims: Cultural Studies of Science Education is a peer reviewed journal that provides an interactive platform for researchers
    working in the multidisciplinary fields of cultural studies and science education. By taking a cultural approach and paying
    attention to theories from cultural studies, this new journal reflects the current diversity in the study of science education
    in a variety of contexts, including schools, museums, zoos, laboratories, parks and gardens, aquariums and community development,
    maintenance and restoration. This journal focuses on science education as a cultural, cross-age, cross-class, and cross-disciplinary
    phenomenon; publishes articles that have an explicit and appropriate connection with and immersion in cultural studies;
    seeks articles that have theory development as an integral aspect of the data presentation; establishes bridges between
    science education and social studies of science, public understanding of science, science/technology and human values,
    and science and literacy; builds new communities at the interface of currently distinct discourses; aims to be a catalyst
    that forges new genres of and for scholarly dissemination; provides an interactive dialogue that includes the editors,
    members of the review board, and selected international scholars; publishes manuscripts that encompass all forms of scholarly
    activity; includes research articles, essays, OP-ED, critical, comments, criticisms and letters on emerging issues of
    significance.
  source: https://link.springer.com/journal/11422/aims-and-scope
Current Psychology:
  aims: 'Current Psychology is an international forum for rapid dissemination of peer-reviewed research at the cutting edge
    of psychology. It welcomes significant and rigorous empirical and theoretical contributions from all the major areas of
    psychology, including but not limited to: cognitive psychology and cognition, social, clinical, health, developmental,
    methodological, and personality psychology, neuropsychology, psychometrics, human factors, and educational psychology.'
  source: https://link.springer.com/journal/12144/aims-and-scope
Data in Brief:
  aims: FAQs Data in Brief . Data in Brief is a multidisciplinary, open access, peer-reviewed journal, which mainly publishes
    short, digestible data articles that describe and provide access to research data. In addition, it publishes review and
    perspective articles that elaborate on data sharing practices, and letters to editors that comment on datasets previously
    published in Data in Brief . Data in Brief contributes contributes to open science and improves reproducibility by making
    data and the associated research more discoverable, opening doors for collaboration, and reducing duplication of effort.
