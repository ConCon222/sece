Studies in Philosophy and Education:
  aims: Studies in Philosophy and Education is an international peer-reviewed journal that focuses on the philosophical, theoretical,
    normative and conceptual problems and issues in educational research, policy and practice. As such, Studies in Philosophy
    and Education is not the expression of any one philosophical or theoretical school or cultural tradition. Rather, the
    journal promotes exchange and collaboration among philosophers, philosophers of education, educational and social science
    researchers, and educational policy makers throughout the world. Contributions that address this wide audience, while
    clearly presenting a philosophical argument and reflecting standards of academic excellence, are encouraged. Topics may
    range widely from important methodological issues in educational research as shaped by the philosophy of science to substantive
    educational policy problems as shaped by moral and social and political philosophy and educational theory. In addition,
    single issues of the journal are occasionally devoted to the critical discussion of a special topic of educational and
    philosophical importance. There is also a frequent Reviews and Rejoinders’ section, featuring book review essays with
    replies from the authors.
