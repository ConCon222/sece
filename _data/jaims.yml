    education and ongoing professional education; the cultural, economic, political, social, practice-based, and/or technological
    dimensions and contexts of teacher education; change, stability, reform and resistance in (and relating to) teacher education;
    enhancing the significance of research in teacher education. The editors of the Asia-Pacific Journal of Teacher Education
    take teachers and teacher educators seriously as human beings who, individually and collectively, seek to make a difference
