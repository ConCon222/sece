- journal: Ethnic and Racial Studies
  publisher: Taylor & Francis
  tag:
  - Ethnic Studies
  title: Tools, tips, and journal insights to help you publish your work with confidence.
  abstract_deadline: ''
  fullpaper_deadline: ''
  fullpaper_deadline_sort: '9999-99-99'
  editors: ''
  link: https://think.taylorandfrancis.com/ers-early-career/
  description: 'You know more than you think It is normal to feel unsure of yourself or experience imposter syndrome when
    starting out as a reviewer. You might wonder whether you know enough to evaluate a submitted manuscript. But the reality
    is, if you have been asked to review, it is because the editors believe you have something valuable to contribute. Do
    not underestimate your fresh perspective—being earlier in your career means you are often more up-to-date on cutting-edge
    methods and emerging literature. Trust your training and the critical thinking skills you have developed. Think of it
    as a conversation, not a judgement Peer reviewing is less about “grading” a paper and more about engaging in a dialogue
    with the authors (and ideally, with the editor and other peer reviewers). Imagine you are offering thoughtful feedback
    to a colleague helping to improve a manuscript reach its full potential, not critiquing from a distance. Be curious—ask
    yourself what you would want to know more about or what would make the argument stronger. The best reviews balance acknowledgment
    of what is strong with suggestions for improvement. It is also okay not to have all the answers when reviewing a manuscript.
    In fact, acknowledging uncertainty or gaps in your expertise is part of being a responsible reviewer. You can also let
    the editor know that you are an ECR and reviewing for the first (or second, or third) time, and they will appreciate your
    transparency. And keep in mind that peer reviewers are not the ones making the final decision: your role is to provide
    feedback that helps the editor weigh different perspectives from multiple reviewers. The editor’s decision also factors
    in the journal’s preferences, scope, and broader editorial strategy. Knowing this removes the pressure to deliver a ‘perfect’
    review, and reframes it as a collaborative process, which benefits everyone involved. Use It as a Learning Opportunity
    Reviewing is one of the best ways to improve your own research. As you critically engage with someone else’s work, you
    will naturally sharpen your analytical skills and get a clearer sense of what makes a strong paper. You will also get
    an insider’s view of the review process, which will help you when your own work is under review. So, do not feel like
    you need to be an expert to review—use the opportunity to learn and grow. It is a win-win. My experience as an ECR peer
    reviewer for Ethnic & Racial Studies has been educational and rewarding. It gave me the confidence to trust my voice in
    the academic community, helped me become a more critical reader of research and allowed me to improve my own work by seeing
    what happens on the other side of the review process. I encourage other early career researchers to take up this role
    when offered the opportunity—it is a chance to engage with cutting-edge work and contribute to the advancement of our
    field. Peer reviewing helped me see that the process is not reserved for senior academics; it is a collaborative effort
    where different perspectives, including those from ECRs, are highly valuable. The experience empowered me to see myself
    as part of the academic conversation, not just as a contributor of my own work, but as someone who could help shape the
    field through constructive feedback.'
